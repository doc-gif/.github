# Checks this repo's own PR bodies with the reusable check, using the PR's own checker and template.
# The PR can change both, so a pass is not a review; the review checks the body too.
name: PR body

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-body:
    uses: ./.github/workflows/check-pr-body.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
